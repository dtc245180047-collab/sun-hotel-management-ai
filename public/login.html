<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập - SUN HOTEL</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --navy: #152a43;
      --navy-light: #203d5c;
      --gold: #c9a646;
      --bg: #f4f6f9;
      --border: #e5e9ef;
      --text: #243247;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Arial, sans-serif;
      padding: 20px;
    }
    .login-card {
      background: white;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      overflow: hidden;
      border-top: 5px solid var(--gold);
    }
    .login-header {
      padding: 30px 25px 10px;
      text-align: center;
    }
    .login-header .brand {
      color: var(--navy);
      font-size: 26px;
      font-weight: 800;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .login-header .brand i { color: var(--gold); }
    .login-header p { color: #64748b; font-size: 13px; margin-top: 5px; }
    .login-body { padding: 15px 30px 30px; }
    .form-label { font-weight: 700; color: var(--text); font-size: 14px; margin-bottom: 6px; }
    .form-control {
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 14px;
    }
    .form-control:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201, 166, 70, 0.2);
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--gold);
      color: white;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-submit:hover { background: #b08f35; }
    .hint-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      color: #64748b;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <a class="brand" href="#"><i class="fas fa-sun"></i> SUN HOTEL</a>
      <p>Hệ thống Quản lý Khách sạn Nội bộ</p>
    </div>
    
    <div class="login-body">
      <form onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="form-label">Tài khoản đăng nhập</label>
          <input type="text" id="username" class="form-control" required placeholder="Nhập tài khoản (vd: letan01)..." autocomplete="off">
        </div>

        <div class="mb-4">
          <label class="form-label">Mật khẩu</label>
          <input type="password" id="password" class="form-control" required placeholder="Nhập mật khẩu..." autocomplete="off">
        </div>

        <button type="submit" class="btn-submit">
          <i class="fas fa-sign-in-alt me-1"></i> Đăng nhập Hệ thống
        </button>
      </form>

      <!-- BẢNG GỢI Ý TÀI KHOẢN ĐỂ TEST -->
      <div class="hint-box mt-4">
        <div class="fw-bold mb-1 text-dark"><i class="fas fa-info-circle me-1 text-primary"></i> Danh sách tài khoản thử nghiệm:</div>
        <div>• <strong>Lễ tân:</strong> <code>letan01</code> / <code>123456</code></div>
        <div>• <strong>Kế toán:</strong> <code>ketoan01</code> / <code>123456</code></div>
        <div>• <strong>Admin:</strong> <code>admin</code> / <code>123456</code></div>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    // Danh sách tài khoản cố định + Vai trò tương ứng
    const userAccounts = {
      "letan01": { pass: "123456", role: "RECEPTIONIST" },
      "ketoan01": { pass: "123456", role: "ACCOUNTANT" },
      "admin": { pass: "123456", role: "ADMIN" }
    };

    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById("username").value.trim().toLowerCase();
      const pass = document.getElementById("password").value.trim();

      if (userAccounts[user]) {
        if (userAccounts[user].pass === pass) {
          // Lưu vai trò đăng nhập vào LocalStorage
          localStorage.setItem("sun_current_role", userAccounts[user].role);
          
          // Chuyển hướng trực tiếp tới trang Dashboard
          window.location.href = "dashboard.html";
        } else {
          alert("❌ Mật khẩu không chính xác. Vui lòng thử lại!");
        }
      } else {
        alert("❌ Tài khoản không tồn tại trên hệ thống!");
      }
    }
  </script>

</body>
</html>
