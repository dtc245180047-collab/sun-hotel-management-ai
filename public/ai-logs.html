<!-- public/ai-logs.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhật ký AI - SUN HOTEL</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f4f8; }
    .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
    .status-success { color: #059669; }
    .status-error { color: #dc2626; }
    .truncate { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="container py-4">
    <a href="dashboard.html" class="text-muted text-decoration-none mb-3 d-inline-block">← Quay lại</a>
    
    <h3 class="fw-bold mb-4">📋 Nhật ký Hoạt động Trợ lý AI</h3>
    
    <!-- Bộ lọc -->
    <div class="card mb-4">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label">Từ ngày</label>
            <input type="date" class="form-control" id="dateFrom">
          </div>
          <div class="col-md-3">
            <label class="form-label">Đến ngày</label>
            <input type="date" class="form-control" id="dateTo">
          </div>
          <div class="col-md-3">
            <label class="form-label">Người dùng</label>
            <select class="form-select" id="userFilter">
              <option value="">Tất cả</option>
              <option value="le_tan">Lễ tân</option>
              <option value="quan_ly">Quản lý</option>
            </select>
          </div>
          <div class="col-md-3 align-self-end">
            <button class="btn btn-primary w-100" id="filterBtn">Lọc</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Thống kê nhanh -->
    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="card">
          <div class="card-body py-3">
            <p class="text-muted small mb-1">Tổng lượt gọi AI</p>
            <p class="fs-4 fw-bold text-primary" id="totalCalls">--</p>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card">
          <div class="card-body py-3">
            <p class="text-muted small mb-1">Thành công</p>
            <p class="fs-4 fw-bold text-success" id="successRate">--%</p>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card">
          <div class="card-body py-3">
            <p class="text-muted small mb-1">Trung bình thời gian</p>
            <p class="fs-4 fw-bold" id="avgTime">--s</p>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card">
          <div class="card-body py-3">
            <p class="text-muted small mb-1">Lỗi hôm nay</p>
            <p class="fs-4 fw-bold text-danger" id="todayErrors">--</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Bảng Nhật ký -->
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Chi tiết hoạt động</h5>
        <button class="btn btn-sm btn-outline-primary" id="exportBtn">Xuất Excel</button>
      </div>
      <div class="card-body p-0">
        <table class="table mb-0">
          <thead class="table-light">
            <tr>
              <th>Thời gian</th>
              <th>Người dùng</th>
              <th>Loại yêu cầu</th>
              <th>Nội dung yêu cầu</th>
              <th>Trạng thái</th>
              <th>Thời gian xử lý</th>
              <th>Chi tiết</th>
            </tr>
          </thead>
          <tbody id="logsTable">
            <tr>
              <td colspan="7" class="text-center text-muted py-4">Đang tải dữ liệu...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    async function loadLogs() {
      try {
        const res = await fetch('/api/ai-logs/list');
        const data = await res.json();
        
        if (data.success) {
          // Cập nhật thống kê
          document.getElementById('totalCalls').textContent = data.total;
          document.getElementById('successRate').textContent = data.successRate + '%';
          document.getElementById('avgTime').textContent = data.avgTime + 's';
          document.getElementById('todayErrors').textContent = data.todayErrors;
          
          // Hiển thị bảng
          const tbody = document.getElementById('logsTable');
          tbody.innerHTML = '';
          
          data.logs.forEach(log => {
            const statusClass = log.status === 'thanh_cong' ? 'status-success' : 'status-error';
            const statusText = log.status === 'thanh_cong' ? 'Thành công' : 'Thất bại';
            
            tbody.innerHTML += `
              <tr>
                <td class="small">${new Date(log.created_at).toLocaleString('vi-VN')}</td>
                <td>${log.user_name || 'Không xác định'}</td>
                <td><span class="badge bg-light text-dark">${log.type}</span></td>
                <td class="truncate" title="${escapeHtml(log.prompt)}">${escapeHtml(log.prompt)}</td>
                <td class="${statusClass} fw-medium">${statusText}</td>
                <td>${log.response_time || '--'}s</td>
                <td>
                  <button class="btn btn-sm btn-outline-secondary" onclick="showDetail(${log.id})">Xem</button>
                </td>
              </tr>
            `;
          });
        }
      } catch (err) {
        console.error('Lỗi tải nhật ký:', err);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showDetail(id) {
      window.open(`/ai-log-detail.html?id=${id}`, '_blank');
    }

    document.getElementById('filterBtn').addEventListener('click', loadLogs);
    document.getElementById('exportBtn').addEventListener('click', () => {
      alert('Chức năng xuất Excel sẽ được triển khai trong phiên bản tiếp theo');
    });

    loadLogs();
  </script>
</body>
</html>
